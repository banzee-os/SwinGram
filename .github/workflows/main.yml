name: Build Telegram APK

on:
  push:
    branches: [ "master", "main" ]  # Замените на вашу ветку
  pull_request:
    branches: [ "master", "main" ]
  workflow_dispatch:  # Чтобы запускать вручную из интерфейса GitHub

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: 'recursive'  # Важно! У Telegram есть сабмодули

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Decode Google Services (если есть Firebase)
      env:
        GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
      run: |
        if [ -n "$GOOGLE_SERVICES_JSON" ]; then
          echo "$GOOGLE_SERVICES_JSON" | base64 --decode > TMessagesProj/google-services.json
        fi

    - name: Create local.properties
      run: |
        echo "sdk.dir=$ANDROID_HOME" > local.properties

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build APK (Debug)
      run: ./gradlew assembleDebug

    - name: Build APK (Release) - если есть ключи
      run: ./gradlew assembleRelease
      env:
        STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      continue-on-error: true  # Не падает, если нет ключей

    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: Telegram-Debug-APK
        path: TMessagesProj/build/outputs/apk/debug/*.apk

    - name: Upload Release APK (если собрался)
      uses: actions/upload-artifact@v4
      with:
        name: Telegram-Release-APK
        path: TMessagesProj/build/outputs/apk/release/*.apk
